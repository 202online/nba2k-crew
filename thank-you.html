<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>TDC // The DEMONStration CREW</title>
    <meta name="description" content="TDC is a high-IQ basketball family built on chemistry, team play, and a positive gaming community.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        crew: {
                            green: '#39ff14',
                            emerald: '#00ff9d',
                            purple: '#d000ff',
                            violet: '#9d00ff',
                            black: '#000000',
                            dark: '#08080c',
                            surface: '#101014'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --electric-green: #39ff14;
            --electric-purple: #d000ff;
            --page-black: #000000;
            --panel-black: #08080c;
            --soft-white: #edf7ef;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 6rem;
        }

        body {
            min-height: 100%;
            margin: 0;
            overflow-x: hidden;
            background: var(--page-black);
            color: var(--soft-white);
            font-family: 'Inter', sans-serif;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .family-way-heading,
        .family-way-title,
        .family-way-tally {
            font-family: 'Barlow Condensed', sans-serif;
        }

        section,
        footer {
            background-color: var(--page-black);
        }

        .hero-bg {
            background:
                radial-gradient(circle at 18% 20%, rgba(57, 255, 20, 0.08), transparent 30%),
                radial-gradient(circle at 82% 25%, rgba(208, 0, 255, 0.10), transparent 32%),
                linear-gradient(180deg, #000000, #030306);
        }

        .glass-card {
            background: rgba(8, 8, 12, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.05);
        }

        .glass-card:hover {
            border-color: rgba(208, 0, 255, 0.55);
            box-shadow: 0 0 22px rgba(208, 0, 255, 0.14);
        }

        .gradient-text {
            background: linear-gradient(110deg, var(--electric-green), var(--electric-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-crew-green,
        .text-emerald-300,
        .text-green-400 {
            color: var(--electric-green) !important;
            -webkit-text-fill-color: var(--electric-green);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.45);
        }

        .text-crew-purple,
        .text-fuchsia-300,
        .text-purple-300 {
            color: var(--electric-purple) !important;
            -webkit-text-fill-color: var(--electric-purple);
            text-shadow: 0 0 8px rgba(208, 0, 255, 0.45);
        }

        .text-white {
            color: var(--soft-white) !important;
        }

        [class*="from-crew-green"][class*="to-crew-purple"] {
            background-image: linear-gradient(110deg, var(--electric-green), var(--electric-purple)) !important;
            box-shadow: 0 0 18px rgba(208, 0, 255, 0.22);
        }

        .badge-green {
            background: rgba(57, 255, 20, 0.08);
            color: #a7ff91;
            border: 1px solid rgba(57, 255, 20, 0.50);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.12);
        }

        .badge-purple {
            background: rgba(208, 0, 255, 0.08);
            color: #ed9cff;
            border: 1px solid rgba(208, 0, 255, 0.50);
            box-shadow: 0 0 10px rgba(208, 0, 255, 0.12);
        }

        .section-divider {
            width: 96px;
            height: 2px;
            margin-inline: auto;
            background: linear-gradient(90deg, var(--electric-green), var(--electric-purple));
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
        }

        .hero-panel {
            position: relative;
            isolation: isolate;
            background: linear-gradient(135deg, rgba(16, 16, 20, 0.96), rgba(12, 12, 18, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.07), 0 0 30px rgba(208, 0, 255, 0.07);
        }

        .hero-panel::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0;
            border-radius: inherit;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
            pointer-events: none;
        }

        .pulse-orb {
            position: absolute;
            z-index: -1;
            width: 190px;
            height: 190px;
            border-radius: 9999px;
            filter: blur(58px);
            opacity: 0.4;
            pointer-events: none;
        }

        .pulse-orb.green {
            top: -50px;
            right: 15px;
            background: rgba(57, 255, 20, 0.25);
        }

        .pulse-orb.purple {
            bottom: -50px;
            left: 15px;
            background: rgba(208, 0, 255, 0.22);
        }

        .floating-card {
            position: absolute;
            right: -8px;
            bottom: 26px;
            width: 164px;
            background: rgba(9, 9, 12, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.45);
        }

        .floating-card.left {
            left: -8px;
            right: auto;
            bottom: 58px;
            width: 150px;
        }

        .floating-pill {
            border: 1px solid rgba(57, 255, 20, 0.3);
            background: rgba(57, 255, 20, 0.06);
            color: var(--electric-green);
        }

        .floating-pill.purple {
            border-color: rgba(208, 0, 255, 0.35);
            background: rgba(208, 0, 255, 0.06);
            color: var(--electric-purple);
        }

        .stats-bar {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(57,255,20,0.08), rgba(208,0,255,0.08));
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card > * {
            position: relative;
            z-index: 1;
        }

        .cta-glow {
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.20), 0 0 25px rgba(208, 0, 255, 0.12);
        }

        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.65s ease, transform 0.65s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .family-way-list {
            list-style: none;
            padding: 0;
        }

        .family-way-item {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background: linear-gradient(110deg, rgba(15, 15, 20, 0.98), rgba(7, 7, 10, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .family-way-item:nth-child(odd) {
            --item-accent: var(--electric-green);
            --item-glow: rgba(57, 255, 20, 0.13);
            border-left: 4px solid var(--item-accent);
        }

        .family-way-item:nth-child(even) {
            --item-accent: var(--electric-purple);
            --item-glow: rgba(208, 0, 255, 0.15);
            border-left: 4px solid var(--item-accent);
        }

        .family-way-item::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0;
            background:
                repeating-linear-gradient(
                    135deg,
                    transparent 0,
                    transparent 14px,
                    rgba(255, 255, 255, 0.018) 14px,
                    rgba(255, 255, 255, 0.018) 16px
                ),
                radial-gradient(circle at 100% 0, var(--item-glow), transparent 55%);
            pointer-events: none;
        }
