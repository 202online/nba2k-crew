<form
    id="join-form"
    action="https://api.staticforms.xyz/submit"
    method="POST"
    class="space-y-4"
>
    <!-- Replace these placeholders when your Static Forms setup is ready. -->
    <input type="hidden" name="accessKey" value="YOUR_STATIC_FORMS_ACCESS_KEY">
    <input type="hidden" name="subject" value="New TDC Family Application">
    <input type="hidden" name="redirectTo" value="https://YOUR-DOMAIN/thank-you.html">

    <!-- Honeypot spam protection: keep this field empty. -->
    <div aria-hidden="true" class="absolute -left-[9999px]">
        <label for="website">Leave this field empty</label>
        <input
            id="website"
            type="text"
            name="honeypot"
            tabindex="-1"
            autocomplete="off"
        >
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label for="gamertag" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Gamertag / PSN ID *
            </label>
            <input
                id="gamertag"
                name="name"
                type="text"
                required
                autocomplete="nickname"
                placeholder="Your player tag"
                class="border rounded-xl px-4 py-3"
            >
        </div>

        <div>
            <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Email *
            </label>
            <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                class="border rounded-xl px-4 py-3"
            >
        </div>

        <div>
            <label for="platform" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Platform *
            </label>
            <select id="platform" name="platform" required class="border rounded-xl px-4 py-3">
                <option value="" disabled selected>Select platform</option>
                <option value="PlayStation 5">PlayStation 5</option>
                <option value="Xbox Series X|S">Xbox Series X|S</option>
                <option value="PC">PC</option>
            </select>
        </div>

        <div>
            <label for="position" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Preferred Position *
            </label>
            <select id="position" name="position" required class="border rounded-xl px-4 py-3">
                <option value="" disabled selected>Select position</option>
                <option value="PG">Point Guard</option>
                <option value="SG">Shooting Guard</option>
                <option value="SF">Small Forward</option>
                <option value="PF">Power Forward</option>
                <option value="C">Center</option>
                <option value="Flex">Flex / Multiple Positions</option>
            </select>
        </div>

        <div>
            <label for="build" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Build Style
            </label>
            <input
                id="build"
                name="build"
                type="text"
                placeholder="e.g. 3&D wing, pass-first PG"
                class="border rounded-xl px-4 py-3"
            >
        </div>

        <div>
            <label for="play-style" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                What Do You Bring to the Team?
            </label>
            <input
                id="play-style"
                name="playStyle"
                type="text"
                placeholder="e.g. defense, spacing, playmaking"
                class="border rounded-xl px-4 py-3"
            >
        </div>

        <div>
            <label for="availability" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Usual Play Times
            </label>
            <input
                id="availability"
                name="availability"
                type="text"
                placeholder="e.g. weekday evenings, weekends"
                class="border rounded-xl px-4 py-3"
            >
        </div>

        <div>
            <label for="run-type" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                What Kind of Runs Are You Looking For?
            </label>
            <select id="run-type" name="runType" class="border rounded-xl px-4 py-3">
                <option value="" selected>Select one (optional)</option>
                <option value="Competitive">Competitive</option>
                <option value="Casual">Casual</option>
                <option value="Both">Both</option>
            </select>
        </div>

        <div>
            <label for="mic" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Mic / Team Communication
            </label>
            <select id="mic" name="teamCommunication" class="border rounded-xl px-4 py-3">
                <option value="" selected>Select one (optional)</option>
                <option value="Mic available">I have a mic</option>
                <option value="Can listen">I can listen and communicate when needed</option>
                <option value="No mic">I do not have a mic</option>
            </select>
        </div>

        <div>
            <label for="discord" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                Discord / Social Handle (Optional)
            </label>
            <input
                id="discord"
                name="discord"
                type="text"
                placeholder="Your Discord or social handle"
                class="border rounded-xl px-4 py-3"
            >
        </div>
    </div>

    <div>
        <label for="why-tdc" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Why Do You Want to Join TDC?
        </label>
        <textarea
            id="why-tdc"
            name="whyTdc"
            rows="3"
            placeholder="What are you looking for in a crew?"
            class="border rounded-xl px-4 py-3"
        ></textarea>
    </div>

    <div>
        <label for="intro-message" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Anything Else We Should Know?
        </label>
        <textarea
            id="intro-message"
            name="additionalInfo"
            rows="3"
            placeholder="Share anything else that helps us get to know you."
            class="border rounded-xl px-4 py-3"
        ></textarea>
    </div>

    <p class="text-xs text-slate-400 leading-relaxed">
        We’ll use your information to review your application and contact you about joining.
        Don’t include passwords or sensitive personal information.
    </p>

    <div class="flex items-start gap-3">
        <input
            id="privacy-consent"
            name="privacyConsent"
            type="checkbox"
            value="Agreed"
            required
            class="mt-1 h-4 w-4 accent-crew-green"
        >
        <label for="privacy-consent" class="text-xs text-slate-300 leading-relaxed">
            I agree that TDC may use my information to review this application and contact me about joining.
            See the <a href="/privacy.html" class="text-crew-green underline">Privacy Notice</a>. *
        </label>
    </div>

    <button
        type="submit"
        class="w-full py-3.5 rounded-xl font-display font-bold text-sm text-black bg-gradient-to-r from-crew-green to-crew-purple hover:brightness-110 flex items-center justify-center gap-2"
    >
        <i class="fa-solid fa-paper-plane"></i> Send Family Request
    </button>
</form>
